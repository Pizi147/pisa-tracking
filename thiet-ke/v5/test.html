<style>
  /* ---- Chấm Test: danh sách trái + khu chấm phải ---- */
  .cham { display: grid; grid-template-columns: 440px minmax(0, 1fr); gap: 16px; align-items: start; }
  .tong-cham { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--vien); font-size: 14px; color: var(--chu-2); }
  .tong-cham b { color: var(--chu); font-family: var(--phong-so); }
  .nhom { border-bottom: 1px solid var(--vien); }
  .nhom:last-child { border-bottom: 0; }
  .nhom-dau, .nhom > summary { display: flex; align-items: baseline; gap: 8px; padding: 12px 16px 6px; font-size: 14px; font-weight: 700; list-style: none; }
  .nhom > summary { cursor: pointer; padding-bottom: 12px; }
  .nhom > summary::-webkit-details-marker { display: none; }
  .nhom > summary::before { content: "▸"; color: var(--chu-3); width: 12px; }
  .nhom[open] > summary::before { content: "▾"; }
  .nhom[open] > summary { padding-bottom: 6px; }
  .nhom-dau .dem-nhom, .nhom > summary .dem-nhom { font-weight: 500; color: var(--chu-2); font-size: 13px; }
  .nhom-dau .qua-han { color: var(--loi); }
  .nhom .ghi-nhom { padding: 0 16px 8px; font-size: 12px; color: var(--chu-3); }
  .dong-cham { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 16px; border-top: 1px solid var(--vien); cursor: pointer; align-items: center; }
  .dong-cham:hover { background: var(--hover); }
  .dong-cham.dang-mo { background: var(--dang-mo); box-shadow: inset 3px 0 0 var(--nhan); }
  .dong-cham .ten-nhom { font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .dong-cham .chi-tiet { grid-column: 1; font-size: 13px; color: var(--chu-2); display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; }
  .dong-cham .ben-phai { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .tien-do { font-family: var(--phong-so); font-size: 13px; color: var(--chu-2); }
  .tien-do b { color: var(--chu); }
  .rong-nhom { padding: 6px 16px 14px; font-size: 13px; color: var(--chu-3); }

  .khu { display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 560px; position: sticky; top: 12px; }
  .khu-cuon { flex: 1; min-height: 0; overflow: auto; }
  .khu .phu-o { white-space: normal; }
  .khu-dau { display: flex; gap: 12px; align-items: flex-start; padding: 16px 20px 12px; border-bottom: 1px solid var(--vien); flex-wrap: wrap; }
  .khu-dau h2 { font-size: 17px; }
  .khu-dau .ngu-canh { font-size: 13px; color: var(--chu-2); margin-top: 4px; display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; }
  .khu-dau .quay-lai { display: none; }
  .khu .bang td { height: 52px; }
  .khu .bang input.o { width: 72px; height: 36px; text-align: center; font-family: var(--phong-so); font-weight: 600; }
  .khu tr.dang-sua td { background: var(--dang-mo); }
  .khu tr.dang-sua td:first-child { box-shadow: inset 3px 0 0 var(--nhan); }
  .khu tr.mo-rong td { background: var(--dang-mo); padding: 4px 12px 16px; height: auto; }
  .soan { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; }
  .soan .nguyen-nhan { display: flex; flex-wrap: wrap; gap: 6px; }
  .soan .nguyen-nhan label { height: 32px; font-size: 13px; padding: 0 10px; }
  .dem-chu { font-size: 12px; color: var(--chu-3); font-family: var(--phong-so); }
  
  .the-dt { display: none; }

  /* ---- Lịch tuần ---- */
  .thanh-tuan { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--vien); }
  .thanh-tuan .tuan { font-weight: 700; font-size: 17px; min-width: 210px; text-align: center; font-family: var(--phong-so); }
  .thanh-tuan .tuan small { display: block; font-size: 12px; color: var(--chu-3); font-weight: 500; font-family: var(--phong); }
  .thanh-tuan .tuan .nay { color: var(--hong-chu); }
  .thanh-tuan .loc { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .dai-qua-han { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--vien); font-size: 14px; }
  .dai-qua-han .nhan { font-weight: 700; color: var(--loi); }
  .lich .bang td { vertical-align: top; }
  .kn-td { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .kn-o { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-family: var(--phong-so); background: var(--be-mat-2); color: var(--chu-2); border: 1px solid transparent; white-space: nowrap; }
  .kn-o b { font-family: var(--phong); color: var(--chu); font-weight: 700; }
  .kn-o.xong { color: var(--dat); }
  .kn-o.xong::before { content: "✓"; }
  .kn-o.qua { color: var(--loi); background: var(--loi-nen); border-color: var(--loi-vien); }
  .kn-o.qua::before { content: "⚠"; font-size: 11px; }
  .kn-o.toi { border-color: var(--nhan-vien); background: var(--be-mat); }
  .kn-o .nguoi { font-family: var(--phong); color: var(--chu-3); font-size: 12px; }
  .ngay-td { font-family: var(--phong-so); font-weight: 600; white-space: nowrap; }

  /* ---- Kế hoạch Test ---- */
  .kh-tom { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--vien); font-size: 14px; }
  .o-mt { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; font-size: 13px; font-family: var(--phong-so); }
  .o-mt .tt { font-family: var(--phong); font-size: 12px; color: var(--chu-3); }
  .o-mt.xong { color: var(--dat); font-weight: 600; }
  .o-mt.them { color: var(--nhan); font-weight: 700; }

  /* ---- Toast hoàn tác ---- */
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: none; gap: 14px; align-items: center; padding: 12px 16px; border-radius: 10px; background: var(--xam-900); color: #fff; font-size: 14px; box-shadow: var(--bong-noi); z-index: 30; max-width: calc(100% - 32px); }
  :root[data-theme="dark"] .toast { background: #e9ecf7; color: #0b1026; }
  .toast button { font: inherit; font-weight: 700; color: #f9b8d4; background: none; border: 0; cursor: pointer; }
  :root[data-theme="dark"] .toast button { color: #9e1b55; }
  body[data-khung="huy-cu"] .toast { display: flex; }

  /* ---- khung trạng thái ---- */
  .bo-khung-tai { display: none; }
  body[data-khung="tai"] .bo-khung-tai { display: block; }
  body[data-khung="tai"] .noi-dung-that { display: none; }
  .xuong { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--be-mat-2), var(--hover), var(--be-mat-2)); margin: 12px 16px; }

  @media (max-width: 1100px) {
    .cham { grid-template-columns: 1fr; }
    .cham.mo-khu .ds { display: none; }
    .cham:not(.mo-khu) .khu { display: none; }
    .khu-dau .quay-lai { display: inline-flex; }
  }
  @media (max-width: 640px) {
    .demo { padding: 8px 12px; }
    .trang { padding: 14px 12px 40px; gap: 12px; }
    .dh { padding: 0 12px; overflow-x: auto; } .dh .an-dt { display: none; }
    .tabs { overflow-x: auto; } .tabs button { white-space: nowrap; padding: 10px 10px; }
    .khu .cuon-bang, .lich .cuon-bang, .ke-hoach .cuon-bang { display: none; }
    .the-dt { display: block; }
    .the-dt article { padding: 12px 14px; border-bottom: 1px solid var(--vien); display: flex; flex-direction: column; gap: 8px; }
    .the-dt .hang { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .soan { grid-template-columns: 1fr; }
    .thanh-tuan .tuan { min-width: 0; flex: 1; }
    .thanh-tuan .loc { margin-left: 0; width: 100%; }
    .khu-dau { flex-direction: column; gap: 6px; } .khu-dau > .bd { display: none; }
    .khu .panel-chan { position: sticky; bottom: 0; z-index: 2; box-shadow: 0 -4px 12px rgba(17,26,66,.08); }
    .khu .panel-chan { flex-wrap: wrap; } .khu .panel-chan .trai { flex-basis: 100%; }
    .khu .panel-chan .nut { flex: 1; justify-content: center; }
    .khu { border-radius: 0; margin: 0 -12px; border-left: 0; border-right: 0; height: auto; min-height: 0; position: static; }
  }
</style>
</head>

<script>
(function () {
  'use strict';
  var B = B2, q = B.q, khung = document.body.dataset.khung;
  var vai = q.get('vai') || 'ha';
  var NG = B.NGUOI[vai];
  var laQuanLy = ['vy', 'phong', 'mai'].indexOf(vai) >= 0, chiXem = vai === 'tam';
  var coChamTest = !laQuanLy && !chiXem;
  var tab = q.get('tab') || (coChamTest ? 'cham' : vai === 'mai' ? 'ke-hoach' : 'lich');
  document.getElementById('chon-vai').value = vai;
  document.getElementById('chon-khung').value = khung;
  document.getElementById('chon-vai').onchange = function () { var u = new URL(location.href); u.searchParams.set('vai', this.value); u.searchParams.delete('tab'); u.searchParams.delete('nhom'); location.href = u; };
  document.getElementById('chon-khung').onchange = function () { B.moKhung(this.value); };
  document.getElementById('dem-viec').textContent = { ha: 7, khoa: 6, trang: 2, huong: 0, vy: 4 }[vai] ?? '';
  if (['', '0'].indexOf(document.getElementById('dem-viec').textContent) >= 0) document.getElementById('dem-viec').remove();
  document.getElementById('pham-vi').textContent = vai === 'phong' ? 'Toàn hệ thống' : vai === 'mai' ? 'Cẩm Phả' : 'Monbay';

  /* ===== NHÓM CHẤM = lớp × lượt × kỹ năng (đơn vị "bài" = một ô kỹ năng của một HV trong một lượt) ===== */
  var NHOM = [
    { id: 'bc205s', lop: 'BC FT 205', luot: 'MT2', kn: 'S', soBai: 11, coDiem: 0, tuanThi: 'W1 SEP', ngayThi: '31/08', han: '09/09', hanK: 'qua', hanT: 'Quá hạn 5 ngày', gv: 'trang', cn: 'BC', mock: true },
    { id: 'fou12lr', lop: 'MB FOU 12', luot: 'Final', kn: 'L, R', soBai: 24, coDiem: 0, tuanThi: 'W3 SEP', ngayThi: '14/09', han: '20/09', hanK: 'sap', hanT: 'Hạn CN 20/09', gv: 'ha', cn: 'MB', mock: false },
    { id: 'ft101l', lop: 'MB FT 101', luot: 'MT3', kn: 'L', soBai: 22, coDiem: 1, tuanThi: 'W3 SEP', ngayThi: '14/09', han: '23/09', hanK: 'cho', hanT: 'Hạn 23/09', gv: 'ha', cn: 'MB', mock: true },
    { id: 'ft101r', lop: 'MB FT 101', luot: 'MT3', kn: 'R', soBai: 22, coDiem: 1, tuanThi: 'W3 SEP', ngayThi: '14/09', han: '23/09', hanK: 'cho', hanT: 'Hạn 23/09', gv: 'ha', cn: 'MB', mock: true },
    { id: 'ft101w1', lop: 'MB FT 101', luot: 'MT3', kn: 'W1', soBai: 22, coDiem: 0, tuanThi: 'W3 SEP', ngayThi: '14/09', han: '23/09', hanK: 'cho', hanT: 'Hạn 23/09', gv: 'khoa', cn: 'MB', mock: true, ghi: 'W2 · Cao Khánh Linh — không tính vào bài của bạn' },
    { id: 'ft102w', lop: 'MB FT 102', luot: 'MT2', kn: 'W', soBai: 14, coDiem: 0, tuanThi: 'W3 SEP', ngayThi: '14/09', han: '23/09', hanK: 'cho', hanT: 'Hạn 23/09', gv: 'khoa', cn: 'MB', mock: true, ghi: 'Chỉ W — L, R của cô Linh, S của cô Trang không tính' },
    { id: 'ft101s', lop: 'MB FT 101', luot: 'MT3', kn: 'S', soBai: 22, coDiem: 0, tuanThi: 'W3 SEP', ngayThi: '14/09', han: '23/09', hanK: 'cho', hanT: 'Hạn 23/09', gv: 'trang', cn: 'MB', mock: true, speaking: true },
    { id: 'ft102s', lop: 'MB FT 102', luot: 'MT2', kn: 'S', soBai: 14, coDiem: 0, tuanThi: 'W3 SEP', ngayThi: '14/09', han: '23/09', hanK: 'cho', hanT: 'Hạn 23/09', gv: 'trang', cn: 'MB', mock: true, speaking: true }
  ];
  var coS = NG && NG.kn && NG.kn.indexOf('S') >= 0;
  var cuaToi = function (n) { return n.gv === vai; };
  var thay = function (n) { return cuaToi(n) || (n.speaking && coS && n.cn === 'MB'); };
  var nhomTheo = {
    qua: NHOM.filter(function (n) { return cuaToi(n) && n.hanK === 'qua'; }),
    nay: NHOM.filter(function (n) { return cuaToi(n) && n.hanK === 'sap'; }),
    s: NHOM.filter(function (n) { return n.speaking && coS && n.cn === 'MB'; }),
    sau: NHOM.filter(function (n) { return cuaToi(n) && n.hanK === 'cho' && !n.speaking; })
  };
  if (khung === 'rong') nhomTheo = { qua: [], nay: [], s: [], sau: [] };
  var tongBai = function (ds) { return ds.reduce(function (a, n) { return a + n.soBai; }, 0); };

  /* ===== TABS ===== */
  var TABS = coChamTest ? [['cham', 'Chấm Test'], ['lich', 'Lịch tuần']] : chiXem ? [['lich', 'Lịch tuần']] : [['lich', 'Lịch tuần'], ['ke-hoach', 'Kế hoạch Test']];
  var tabsEl = document.getElementById('tabs');
  TABS.forEach(function (t) {
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(t[0] === tab));
    b.innerHTML = t[1] + (t[0] === 'cham' && khung !== 'rong' ? '<span class="dem">' + (nhomTheo.qua.length + nhomTheo.nay.length + nhomTheo.sau.length + nhomTheo.s.filter(cuaToi).length) + ' nhóm</span>' : '');
    b.onclick = function () { var u = new URL(location.href); u.searchParams.set('tab', t[0]); location.href = u; };
    tabsEl.appendChild(b);
  });

  var noi = document.getElementById('noi-dung');
  if (khung === 'loi-tai') {
    noi.innerHTML = '<div class="the" style="padding:16px"><div class="bao-loi" role="alert"><span aria-hidden="true">⚠</span><div><b>Không tải được ' + (tab === 'cham' ? 'danh sách chấm' : 'lịch tuần') + '.</b> Kiểm tra mạng rồi bấm Tải lại. Điểm đã lưu không mất.<div style="margin-top:8px"><button class="nut nut-nho" type="button">Tải lại</button></div></div></div></div>';
    return;
  }
  if (tab === 'cham') veCham(); else if (tab === 'lich') veLich(); else veKeHoach();

  /* =================== CHẤM TEST =================== */
  function dongNhom(n, moSan) {
    var nhan = n.speaking ? (cuaToi(n) ? '<span class="bd bd-td dang">Lớp tôi dạy S</span>' : '<span class="bd bd-td cho">Chấm chéo · không tính nợ</span>') : '';
    return '<div class="dong-cham' + (moSan ? ' dang-mo' : '') + '" role="button" tabindex="0" data-nhom="' + n.id + '">' +
      '<span class="ten-nhom"><span class="ky">' + n.kn + '</span>' + n.lop + ' · ' + n.luot + '</span>' +
      '<span class="chi-tiet"><span>' + (n.speaking ? 'Tuần thi ' + n.tuanThi : 'Thi ' + n.ngayThi) + '</span>' + nhan + (n.ghi ? '<span class="phu">' + n.ghi + '</span>' : '') + '</span>' +
      '<span class="ben-phai"><span class="tien-do"><b>' + n.coDiem + '</b>/' + n.soBai + ' bài</span><span class="bd bd-td ' + n.hanK + '">' + n.hanT + '</span></span></div>';
  }
  function veCham() {
    var mo = q.get('nhom') || (nhomTheo.qua[0] || nhomTheo.nay[0] || nhomTheo.s[0] || {}).id;   /* không tự mở nhóm Hạn tuần sau — nhóm đó gập (T14) */
    var cua = nhomTheo.qua.concat(nhomTheo.nay, nhomTheo.sau, nhomTheo.s.filter(cuaToi));
    var cheo = nhomTheo.s.filter(function (n) { return !cuaToi(n); });
    var tom = '<div class="tong-cham"><span>Của tôi: <b>' + cua.length + '</b> nhóm · <b>' + tongBai(cua) + '</b> bài</span>' +
      (cheo.length ? '<span>Có thể chấm: <b>' + tongBai(cheo) + '</b> bài Speaking</span>' : '') +
      '<button class="nut nut-ma nut-nho" type="button" aria-label="Cách đếm" title="Bài = một ô kỹ năng của một HV trong một lượt. Chỉ phần được phân công cho bạn. Bài Speaking chấm chéo không tính nợ.">ⓘ</button></div>';
    var h = '<div class="cham' + (q.get('nhom') ? ' mo-khu' : '') + '"><section class="the ds" aria-label="Bài cần chấm">' + tom;
    h += '<div class="nhom"><div class="nhom-dau">Quá hạn <span class="dem-nhom' + (nhomTheo.qua.length ? ' qua-han' : '') + '">' + (nhomTheo.qua.length ? '⚠ ' + nhomTheo.qua.length + ' nhóm · ' + tongBai(nhomTheo.qua) + ' bài' : '') + '</span></div>' +
      (nhomTheo.qua.length ? nhomTheo.qua.map(function (n) { return dongNhom(n, n.id === mo); }).join('') : '<div class="rong-nhom">Không có bài quá hạn.</div>') + '</div>';
    h += '<div class="nhom"><div class="nhom-dau">Hạn tuần này <span class="dem-nhom">' + (nhomTheo.nay.length ? nhomTheo.nay.length + ' nhóm · ' + tongBai(nhomTheo.nay) + ' bài' : '') + '</span></div>' +

      '<span class="loc">' + (laQuanLy || chiXem ? (vai === 'phong' ? '<button class="chip" aria-pressed="true">Mọi chi nhánh</button><button class="chip" aria-pressed="false">MB</button><button class="chip" aria-pressed="false">BC</button><button class="chip" aria-pressed="false">CP</button>' : '<button class="chip" aria-pressed="true">Fast Track</button><button class="chip" aria-pressed="true">Lớp thường</button>')
        : '<button class="chip" aria-pressed="' + chiCuaToi + '" data-pham="toi">Lớp tôi chấm</button><button class="chip" aria-pressed="' + !chiCuaToi + '" data-pham="ca">Cả chi nhánh</button>') + '</span></div>';
    if (chiXem) h += '<div style="padding:10px 16px;border-bottom:1px solid var(--vien)"><div class="bao-chi-xem">Chỉ xem · CX không có quyền nhập điểm — không có nút Nhập điểm</div></div>';
    if (xemTd && !chiXem) h += '<div class="dai-qua-han">' + (quaHan.length ? '<span class="nhan">⚠ Quá hạn còn thiếu</span>' + quaHan.map(function (d) { return '<span>' + d.lop + ' · ' + d.luot + ' · S <b class="so">' + d.o[4][1] + '/' + d.o[4][2] + '</b> · hạn ' + d.han + '</span><button class="nut nut-ma nut-nho" type="button" data-tuan="' + d.tuan + '">Xem ' + d.tuan + ' ›</button>'; }).join('') : '<span class="phu">Không có lượt quá hạn còn thiếu điểm.</span>') + '</div>';
    if (!dong.length || khung === 'rong') h += '<div class="rong"><div class="tieu">Tuần ' + tuan + ' không có Test ' + (chiCuaToi ? 'bạn chấm' : 'ở ' + (cnXem || 'các chi nhánh')) + '</div><div style="font-size:14px;margin-top:4px">' + (tuan === 'W2 SEP' ? 'Tuần sau có 3 lượt (MB FT 101 MT3, MB FT 102 MT2, MB FOU 12 Final).' : '') + '</div></div>';
    else {
      h += '<div class="cuon-bang"><table class="bang" aria-label="Lịch Test ' + tuan + '"><colgroup><col style="width:104px"><col style="width:190px"><col style="width:76px"><col><col style="width:116px"><col style="width:150px"></colgroup>' +
        '<thead><tr><th>Ngày thi</th><th>Lớp</th><th>Lượt</th><th>' + (xemTd ? 'Kỹ năng · người chấm · tiến độ điểm' : 'Kỹ năng · phần của tôi nổi') + '</th><th>Hạn chấm</th><th data-kieu="nut"></th></tr></thead><tbody>';
      dong.forEach(function (d) {
        var cuaMinh = d.o.filter(function (o) { return o[4] === vai || (coS && o[0] === 'S' && !d.thuong && d.cn === 'MB'); });
        var o = d.o.map(function (k) {
          var xong = k[1] === k[2], qua = d.qua && !xong, toi = k[4] === vai;
          return '<span class="kn-o' + (xong ? ' xong' : '') + (qua ? ' qua' : '') + (toi ? ' toi' : '') + '"><b>' + k[0] + '</b>' + k[1] + '/' + k[2] + ' <span class="nguoi">' + k[3] + '</span></span>';
        }).join('');
        var nut = chiXem ? '' : laQuanLy ? '<button class="nut nut-nho" type="button">' + (d.qua ? 'Nhắc chấm' : 'Nhập điểm') + '</button>'
          : cuaMinh.length && d.tuan !== 'W4 SEP' && d.tuan !== 'W1 OCT' ? '<button class="nut nut-nho" type="button">Nhập điểm ' + cuaMinh.map(function (o) { return o[0]; }).join(', ') + '</button>' : '';
        var hanTd = d.qua ? '<span class="bd bd-td qua">Quá hạn · ' + d.han + '</span>' : '<span class="so">' + d.han + '</span>' + (xemTd ? '<span class="phu-o">chưa tới hạn</span>' : '');
        h += '<tr class="co-phu"><td class="ngay-td">' + d.ngay + '</td><td><a class="ten-ho-so" href="ho-so-lop.html">' + d.lop + '</a>' + (d.thuong ? '<span class="phu-o">Lớp thường</span>' : '') + '</td><td>' + d.luot + '</td><td><div class="kn-td">' + o + '</div>' + (d.ghi ? '<span class="phu-o">' + d.ghi + '</span>' : '') + '</td><td>' + hanTd + '</td><td data-kieu="nut">' + nut + '</td></tr>';
      });
      h += '</tbody></table></div>';
      h += '<div class="the-dt">' + dong.map(function (d) {
        return '<article><div class="hang"><b>' + d.lop + ' · ' + d.luot + '</b><span class="phu">' + d.ngay + '</span></div><div class="kn-td">' + d.o.map(function (k) { var x = k[1] === k[2]; return '<span class="kn-o' + (x ? ' xong' : '') + (d.qua && !x ? ' qua' : '') + (k[4] === vai ? ' toi' : '') + '"><b>' + k[0] + '</b>' + k[1] + '/' + k[2] + '</span>'; }).join('') + '</div><div class="hang">' + (d.qua ? '<span class="bd bd-td qua">Quá hạn · ' + d.han + '</span>' : '<span class="phu">Hạn chấm ' + d.han + '</span>') + '</div></article>';
      }).join('') + '</div>';
    }
    h += '</section><p class="phu">Tiến độ = bài có điểm / bài của lượt. Chưa tới hạn → xám, không cảnh báo (T14). Quá hạn mà còn thiếu → đỏ + ⚠. Tuần cũ vẫn xem / sửa theo quyền.</p>';
    noi.innerHTML = h;
    noi.querySelectorAll('[data-tuan]').forEach(function (b) { b.onclick = function () { if (!b.dataset.tuan) return; var u = new URL(location.href); u.searchParams.set('tuan', b.dataset.tuan); location.href = u; }; });
    noi.querySelectorAll('[data-pham]').forEach(function (b) { b.onclick = function () { var u = new URL(location.href); u.searchParams.set('pham', b.dataset.pham); location.href = u; }; });
  }

  /* =================== KẾ HOẠCH TEST (QL / Admin) — mặc định 3 MT, MT4+ chỉ QL thêm tay (C20, T04) =================== */
  function veKeHoach() {
    var cp = vai === 'mai';
    var lop = cp ? 'CP FT 110' : 'MB FT 101';
    var HV = cp ? [
      ['Hồ Thanh Tùng', 'x', 'x', 'x', 'W1 OCT'], ['Ngô Hải Yến', 'x', 'x', 'x'], ['Lý Tuấn Bình', 'x', 'x', 'x'], ['Đinh Ngọc Quyên', 'x', 'x', 'x'],
      ['Bế Thanh Hoa', 'x', 'x', 'x'], ['Chử Văn Toàn', 'x', 'x', 'x']
    ] : B.FT101.slice(0, 6).map(function (h) { return [h.ten, 'x', 'x', h.id === 'an' ? 'S dời W4 SEP' : h.id === 'thuha' ? 'S huỷ · chờ duyệt dời' : 'W3 SEP']; });
    var coMt4 = HV.some(function (r) { return r[4]; });
    var oMt = function (v, i) {
      if (v === 'x') return '<span class="o-mt xong">✓ Xong</span>';
      if (i === 4) return '<span class="o-mt them">' + v + '<span class="tt">QL thêm tay</span></span>';
      if (v === 'W3 SEP') return '<span class="o-mt">W3 SEP<span class="tt">đang thi</span></span>';
      return '<span class="o-mt" style="color:var(--chu-2)">' + v + '</span>';
    };
    var h = '<section class="the ke-hoach" aria-label="Kế hoạch Test">';
    h += '<div class="thanh-tuan"><b style="font-size:17px">' + lop + '</b><span class="phu">' + (cp ? 'FT LT1 · 10 HV · GVCN Ngô Bảo Nam' : 'FT LT1 · 22 HV · GVCN Trần Ngọc Hà') + '</span><span class="loc"><button class="nut nut-nho" type="button">+ Thêm lượt MT</button></span></div>';
    h += '<div class="kh-tom">' + (cp ? '<span class="bd bd-td xong">Xong 3 MT · 10/10 HV</span><span>MT4: <b class="so">1</b> HV (QL thêm tay)</span><span class="phu">Không có gợi ý xếp thêm — HV xong 3 MT là đủ kế hoạch mặc định.</span>'
      : '<span class="bd bd-td dang">MT3 đang thi · W3 SEP</span><span class="phu">Mặc định 3 MT. Sau MT3 không tự gợi ý MT4.</span>') + '</div>';
    h += '<div class="cuon-bang"><table class="bang"><colgroup><col style="width:44px"><col style="width:230px"><col><col><col>' + (coMt4 ? '<col>' : '') + '</colgroup><thead><tr><th><input type="checkbox" aria-label="Chọn tất cả"></th><th>Học viên</th><th data-kieu="so">MT1</th><th data-kieu="so">MT2</th><th data-kieu="so">MT3</th>' + (coMt4 ? '<th data-kieu="so">MT4</th>' : '') + '</tr></thead><tbody>' +
      HV.map(function (r) { return '<tr><td><input type="checkbox" aria-label="Chọn ' + r[0] + '"></td><td>' + r[0] + '</td>' + [1, 2, 3].map(function (i) { return '<td data-kieu="so">' + oMt(r[i], i) + '</td>'; }).join('') + (coMt4 ? '<td data-kieu="so">' + (r[4] ? oMt(r[4], 4) : '<span class="phu">—</span>') + '</td>' : '') + '</tr>'; }).join('') + '</tbody></table></div>';
    h += '<div class="the-dt">' + HV.slice(0, 3).map(function (r) { return '<article><div class="hang"><b>' + r[0] + '</b></div><div class="hang"><span class="phu">MT1–MT3</span><span class="bd bd-td xong">Xong</span>' + (r[4] ? '<span class="bd bd-td dang">MT4 ' + r[4] + ' · QL thêm</span>' : '') + '</div></article>'; }).join('') + '</div>';
    h += '<div class="phu" style="padding:10px 16px">' + (cp ? 'Đang thấy 6 / 10 HV' : 'Đang thấy 6 / 22 HV') + ' · Chọn HV rồi "+ Thêm lượt MT" để xếp MT4+ (mở hộp chọn tuần). Dời MT3 không thành MT4. MT4+ đã có không bị xoá.</div></section>';
    noi.innerHTML = h;
  }
})();
</script>
