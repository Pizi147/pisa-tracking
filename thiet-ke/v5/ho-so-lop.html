<style>
  .dau-lop { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .dau-lop h1 { font-size: 22px; }
  .dau-lop .meta { font-size: 14px; color: var(--chu-2); display: flex; gap: 4px 12px; flex-wrap: wrap; }
  .dau-lop .hanh-dong { margin-left: auto; display: flex; gap: 8px; }
  .so-lop { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--chu-2); align-items: baseline; }
  .so-lop .gt { font-size: 17px; font-weight: 700; color: var(--chu); font-family: var(--phong-so); margin: 0 4px; }

  .cong-cu { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--vien); flex-wrap: wrap; }
  .cong-cu .tong { margin-left: auto; font-size: 13px; color: var(--chu-2); }
  .chon-luot { font: inherit; font-size: 14px; height: 32px; border: 1px solid var(--vien-o); border-radius: 8px; background: var(--be-mat); color: var(--chu); padding: 0 8px; }
  .viec-lop { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--vien); background: var(--be-mat-2); font-size: 14px; }
  .viec-lop .nhan { font-size: 12px; font-weight: 700; color: var(--chu-3); }
  .luoi-mo { display: none; padding: 12px 16px; border-bottom: 1px solid var(--vien); }
  .luoi-mo.mo { display: block; }

  .bang td.o-bam { cursor: pointer; border-radius: 0; }
  .bang td.o-bam:hover { background: var(--hover); }
  .bang .w-tinh { color: var(--chu-3); font-weight: 500; }
  .bang th.w-tinh, .bang td.w-tinh { background: var(--be-mat-2); }
  .viec-o { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .viec-o .nut { height: 30px; font-size: 13px; padding: 0 10px; }
  .viec-o .khac { font-size: 12px; color: var(--chu-3); }
  .viec-o .dong-v { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  /* panel việc: khung phải nổi, bảng giữ nguyên (G4) */
  .panel-noi { position: fixed; top: 112px; right: 16px; bottom: 16px; width: 480px; z-index: 20; display: none; }
  body.co-panel .panel-noi { display: flex; }
  .panel-noi .panel { flex: 1; min-height: 0; }
  .thanh-buoc { display: flex; gap: 3px; } .thanh-buoc i { flex: 1; height: 4px; border-radius: 2px; background: var(--vien); }
  .thanh-buoc i.xong { background: var(--dat-vien); } .thanh-buoc i.nay { background: var(--nhan); }
  .so-sanh { display: grid; grid-template-columns: 5.5rem repeat(4, 1fr); gap: 4px 8px; font-size: 14px; align-items: center; background: var(--be-mat-2); border-radius: 8px; padding: 10px 12px; }
  .so-sanh .h { font-size: 12px; color: var(--chu-3); font-weight: 600; text-align: center; }
  .so-sanh .c { text-align: center; font-family: var(--phong-so); }
  .so-sanh .nh { font-size: 13px; color: var(--chu-2); }
  .bao-xung-dot { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 8px; background: var(--canh-bao-nen); border: 1px solid var(--canh-bao-vien); font-size: 14px; }
  .bao-xung-dot b { color: var(--canh-bao); }

  /* Ý thức & Phối hợp: 4 khối nghĩa — vi phạm chờ · bậc + duyệt · báo PH · Phối hợp SOS (nhóm riêng) */
  .yt-nhom { padding: 12px 16px 6px; font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; border-top: 1px solid var(--vien); }
  .yt-nhom:first-child { border-top: 0; }
  .yt-nhom .dem-nhom { font-weight: 500; color: var(--chu-2); font-size: 13px; }
  .yt-hang { display: grid; grid-template-columns: 200px minmax(0, 1.4fr) minmax(0, 1fr) 180px 150px; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--vien); align-items: start; }
  .yt-hang .vp { background: var(--canh-bao-nen); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
  .yt-hang .vp.qua { background: var(--loi-nen); }
  .yt-hang .vp b { font-size: 13px; }
  .thang { display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; font-size: 12px; color: var(--chu-3); }
  .thang .bac { padding: 1px 6px; border-radius: 4px; border: 1px solid var(--vien); white-space: nowrap; }
  .thang .bac.qua { color: var(--dat); border-color: var(--dat-vien); }
  .thang .bac.toi { color: var(--nhan); border-color: var(--nhan); font-weight: 700; background: var(--nhan-nen); }
  .yt-dau { display: grid; grid-template-columns: 200px minmax(0, 1.4fr) minmax(0, 1fr) 180px 150px; gap: 12px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--chu-2); background: var(--be-mat-2); border-bottom: 1px solid var(--vien); }
  .phoi-hop { margin: 4px 16px 16px; border: 1px solid var(--dang-vien); border-radius: 10px; background: var(--dang-nen); padding: 12px 14px; display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; font-size: 14px; }
  .lich-su-yt { margin: 0 16px 14px; }

  @media (max-width: 1100px) {
    .panel-noi { left: auto; width: min(480px, calc(100% - 32px)); }
    .yt-hang, .yt-dau { grid-template-columns: 160px minmax(0, 1fr) 160px; }
    .yt-hang > :nth-child(3), .yt-dau > :nth-child(3), .yt-hang > :nth-child(4), .yt-dau > :nth-child(4) { display: none; }
  }
  @media (max-width: 640px) {
    .dau-lop .hanh-dong { margin-left: 0; }
    .cuon-bang.bang-rong { display: none; }
    .panel-noi { top: 0; right: 0; bottom: 0; width: 100%; }
    .panel-noi .panel { border-radius: 0; }
    .panel-chan { flex-wrap: wrap; position: sticky; bottom: 0; } .panel-chan .trai { flex-basis: 100%; } .panel-chan .nut { flex: 1; justify-content: center; }
    .yt-dau { display: none; }
    .yt-hang { grid-template-columns: 1fr; }
    .yt-hang > * { display: block !important; }
    .phoi-hop { grid-template-columns: 1fr; }
    .so-sanh { grid-template-columns: 4.5rem repeat(4, 1fr); }
  }
</style>

<script>
(function () {
  'use strict';
  var B = B2, q = B.q, khung = document.body.dataset.khung;
  var lop = q.get('lop') || 'ft101', vai = q.get('vai') || (lop === 'cp110' ? 'nam' : 'ha');
  var tab = q.get('tab') || (lop === 'cp110' ? 'y-thuc' : 'hoc-vien');
  var chiXem = khung === 'chi-xem';
  ['lop', 'vai', 'khung'].forEach(function (k) {
    var el = document.getElementById('chon-' + k); if (!el) return;
    el.value = k === 'lop' ? lop : k === 'vai' ? vai : khung;
    el.onchange = function () { var u = new URL(location.href); u.searchParams.set(k, this.value); if (k === 'lop') { u.searchParams.delete('tab'); u.searchParams.delete('viec'); u.searchParams.delete('vai'); } location.href = u; };
  });
  if (lop === 'cp110') document.getElementById('chon-vai').innerHTML = '<option value="nam">Thầy Ngô Bảo Nam · GVCN</option>';
  document.getElementById('dem-viec').textContent = { ha: 7, khoa: 6, vy: 4, nam: '' }[vai] || '';
  var tenToi = { ha: 'Trần Ngọc Hà', khoa: 'Lê Minh Khoa', vy: 'Nguyễn Khánh Vy', nam: 'Ngô Bảo Nam' }[vai];
  var url = function (p) { var u = new URL(location.href); for (var k in p) { if (p[k] == null) u.searchParams.delete(k); else u.searchParams.set(k, p[k]); } return u.toString(); };

  /* ---------- ĐẦU TRANG: một dòng nhận diện + một dòng số ---------- */
  var LOP = {
    ft101: { ten: 'MB FT 101', ct: 'Fast Track LT1', gvcn: 'Trần Ngọc Hà', hv: 22, tuan: 'Tuần 16 · khai giảng 01/06',
      so: '<span>Đạt MT2<button class="oso gt" type="button">75 %</button><span class="so">15/20 HV</span></span><span>SOS<button class="oso gt" type="button">5</button>HV</span><span>Thi tháng này<button class="oso gt" type="button">1</button>HV</span><span>Việc của tôi ở lớp<span class="gt">' + (vai === 'khoa' ? 3 : vai === 'vy' ? 1 : 6) + '</span>việc</span>' },
    fou12: { ten: 'MB FOU 12', ct: 'Lớp thường · FOU', gvcn: 'Trần Ngọc Hà', hv: 12, tuan: 'Tuần 8 · khai giảng 27/07',
      so: '<span>Final<span class="gt">0/12</span>HV đủ điểm</span><span>Đánh giá đầu ra<span class="gt">2/12</span>HV đã ghi</span><span>Việc của tôi ở lớp<span class="gt">1</span>việc</span>' },
    cp110: { ten: 'CP FT 110', ct: 'Fast Track LT1', gvcn: 'Ngô Bảo Nam', hv: 10, tuan: 'Tuần 23 · khai giảng 13/04',
      so: '<span>MT1–MT3<span class="gt">10/10</span>HV xong</span><span>Vi phạm chờ báo PH<span class="gt">2</span>HV</span>' }
  }[lop];
  document.getElementById('dau').innerHTML =
    '<div class="dau-lop"><h1>' + LOP.ten + '</h1><span class="meta"><span>' + LOP.ct + '</span><span>GVCN ' + LOP.gvcn + '</span><span>' + LOP.hv + ' HV</span><span>' + LOP.tuan + '</span></span>' +
    (chiXem ? '' : '<span class="hanh-dong"><button class="nut nut-nho" type="button">+ Case</button><button class="nut nut-nho" type="button" aria-label="Thao tác khác">⋯</button></span>') + '</div>' +
    (chiXem ? '<div class="bao-chi-xem" style="margin-top:10px">Lớp đã kết thúc 30/08 — chỉ xem. Sửa điểm cũ theo quyền ở ⋯ › Sửa điểm (có lịch sử).</div>' : '') +
    '<div class="so-lop" style="margin-top:8px">' + LOP.so + '</div>';

  /* ---------- TABS ---------- */
  var TABS = [['hoc-vien', 'Học viên'], ['y-thuc', 'Ý thức & Phối hợp' + (lop === 'fou12' ? '' : ' <span class="dem">⚠ 2</span>')], ['phan-tich', 'Phân tích lớp']];
  if (lop === 'fou12') TABS.splice(1, 0, ['dau-ra', 'Đánh giá đầu ra <span class="dem">2/12</span>']);
  document.getElementById('tabs').innerHTML = TABS.map(function (t) { return '<button type="button" role="tab" aria-selected="' + (t[0] === tab) + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('');
  document.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { location.href = url({ tab: b.dataset.tab, viec: null }); }; });

  var noi = document.getElementById('noi-dung');
  if (khung === 'loi-tai') { noi.innerHTML = '<div class="the" style="padding:16px"><div class="bao-loi" role="alert"><span aria-hidden="true">⚠</span><div><b>Không tải được bảng điểm lớp.</b> Kiểm tra mạng rồi bấm Tải lại.<div style="margin-top:8px"><button class="nut nut-nho" type="button">Tải lại</button></div></div></div></div>'; return; }
  if (tab === 'hoc-vien') lop === 'fou12' ? veFou() : lop === 'cp110' ? veCpHv() : veFt();
  else if (tab === 'dau-ra') veDauRa();
  else if (tab === 'y-thuc') veYThuc();
  else noi.innerHTML = '<div class="the rong"><div class="tieu">Phân tích lớp</div><div style="font-size:14px;margin-top:4px">Ngoài phạm vi V5-B2 (báo cáo — B3). Giữ tab như hiện có.</div></div>';

  /* ===== Cột Việc: việc của người xem trước, mỗi việc một dòng; việc người khác = chữ phụ có tên (C19) ===== */
  function oViec(id) {
    var ds = (B.VIEC_HV[id] || []).slice();
    if (!ds.length) return '<span class="phu">—</span>';
    ds.sort(function (a, b) { return (b.ai === tenToi) - (a.ai === tenToi); });
    return '<div class="viec-o">' + ds.map(function (v, i) {
      if (v.ai === tenToi && !chiXem && v.loai !== 'duyet') return '<span class="dong-v"><button class="nut" type="button" data-viec="' + (v.loai === 'case' ? 'pa-' + id + '-' + v.kn : 'vp-' + id) + '"><span class="cua-toi" aria-hidden="true"></span>' + v.ten + '</button><span class="bd bd-td ' + v.han.k + '">' + v.han.t + '</span></span>';
      if (v.ai === tenToi && v.loai === 'duyet') return '<span class="dong-v"><button class="nut" type="button"><span class="cua-toi" aria-hidden="true"></span>' + v.ten + '</button></span>';
      return '<span class="khac">' + (v.loai === 'duyet' ? '<span class="bd bd-td cho">' + v.han.t + ' · dời MT3 S</span>' : v.ten + ' · ' + v.ai) + '</span>';
    }).join('') + '</div>';
  }

  /* =================== HỌC VIÊN · MB FT 101 =================== */
  function veFt() {
    var luot = q.get('luot') || 'MT2';
    var loc = q.get('loc') || 'tat-ca';
    var ds = B.FT101.filter(function (h) {
      if (loc === 'cua-toi') return (B.VIEC_HV[h.id] || []).some(function (v) { return v.ai === tenToi; });
      if (loc === 'sos') return !!h.sos;
      if (loc === 'thieu') return h.kq === 'thieu';
      return true;
    });
    var soCuaToi = B.FT101.filter(function (h) { return (B.VIEC_HV[h.id] || []).some(function (v) { return v.ai === tenToi; }); });
    var viecCuaToi = soCuaToi.reduce(function (a, h) { return a + B.VIEC_HV[h.id].filter(function (v) { return v.ai === tenToi; }).length; }, 0);
    var knToi = vai === 'ha' ? 'L, R' : vai === 'khoa' ? 'W1' : null;
    var h = '<section class="the" style="overflow:hidden">';
    h += '<div class="cong-cu"><label class="nhan-nho">Lượt <select class="chon-luot" id="chon-luot"><option>MT1</option><option' + (luot === 'MT2' ? ' selected' : '') + '>MT2</option><option' + (luot === 'MT3' ? ' selected' : '') + '>MT3</option></select></label>' +
      '<span class="phu">' + (luot === 'MT3' ? 'Thi 14/09 · đang chấm' : 'Thi 17/08 · đã chốt') + ' · KV = Target − 0,5</span>' +
      ['tat-ca|Tất cả 22', 'cua-toi|Việc của tôi · ' + soCuaToi.length + ' HV · ' + viecCuaToi + ' việc', 'sos|SOS 5', 'thieu|Chưa đủ dữ liệu 2'].map(function (c) { c = c.split('|'); return '<button class="chip" type="button" data-loc="' + c[0] + '" aria-pressed="' + (loc === c[0]) + '">' + c[1] + '</button>'; }).join('') +
      '<span class="tong">' + ds.length + ' / 22 HV</span></div>';
    if (knToi && !chiXem) h += '<div class="viec-lop"><span class="nhan">VIỆC CẤP LỚP</span><span><span class="cua-toi"></span>Nhập điểm MT3 · ' + knToi + '</span><span class="tien-do so">' + (vai === 'ha' ? 'L 1/22 · R 1/22' : 'W1 0/22') + ' bài</span><span class="bd bd-td cho">Hạn 23/09</span><button class="nut nut-nho" type="button" id="mo-luoi">Mở lưới MT3 ▾</button></div>' +
      '<div class="luoi-mo" id="luoi"><span class="phu">Lưới nhập MT3 (' + knToi + ') — cùng khu chấm của <a href="test.html?nhom=ft101l">Chấm Test</a>, mở đúng lượt; đóng mặc định để không chiếm trang.</span></div>';
    h += '<div class="cuon-bang bang-rong"><table class="bang" aria-label="Điểm ' + luot + ' MB FT 101"><colgroup><col style="width:190px"><col style="width:62px"><col style="width:58px"><col style="width:58px"><col style="width:58px"><col style="width:58px"><col style="width:52px"><col style="width:58px"><col style="width:76px"><col style="width:160px"><col style="width:150px"><col></colgroup>' +
      '<thead><tr><th>Học viên</th><th data-kieu="so">Target</th><th data-kieu="diem">L</th><th data-kieu="diem">R</th><th data-kieu="diem">W1</th><th data-kieu="diem">W2</th><th data-kieu="diem" class="w-tinh" title="W = (W1 + 2 × W2) / 3, chỉ để tính Overall">W</th><th data-kieu="diem">S</th><th data-kieu="diem">Overall</th><th>Kết quả</th><th>Ngày thi</th><th>Việc</th></tr></thead><tbody>';
    ds.forEach(function (hv) {
      var m3 = luot === 'MT3';
      var d = function (k, v) {
        if (m3) { var x = (hv.mt3 || {})[k]; if (k === 's' && x === 'vang1') return '<td data-kieu="diem"><span class="diem trong">–</span><span class="phu-o">dời W4 SEP</span></td>'; if (k === 's' && x === 'vang2') return '<td data-kieu="diem"><span class="diem trong">–</span><span class="phu-o">đã huỷ</span></td>'; return '<td data-kieu="diem">' + (typeof x === 'number' ? B.oDiem(x, hv.kv) : '<span class="diem trong">·</span>') + '</td>'; }
        var bam = (vai === 'ha' && (k === 'l' || k === 'r')) || (vai === 'khoa' && k === 'w1') || vai === 'vy';
        return '<td data-kieu="diem"' + (bam && !chiXem ? ' class="o-bam" data-sua="' + hv.id + '-' + k + '" tabindex="0" title="Sửa điểm"' : '') + '>' + (typeof v === 'number' ? B.oDiem(v, hv.kv) : '<span class="diem trong">—</span><span class="phu-o">' + (v || 'chưa có') + '</span>') + '</td>';
      };
      var dangMo = (q.get('viec') || '').split('-')[1] === hv.id;
      h += '<tr class="co-phu bam' + (dangMo ? ' dang-mo' : '') + '"><td><a class="ten-ho-so" href="ho-so-hv.html?hv=' + hv.id + '">' + hv.ten + '</a></td><td data-kieu="so" class="so">' + hv.target.toFixed(1) + '</td>' +
        d('l', hv.l) + d('r', hv.r) + d('w1', hv.w1) + d('w2', hv.w2) +
        '<td data-kieu="diem" class="w-tinh so">' + (m3 ? '·' : hv.w != null ? hv.w.toFixed(1) : '—') + '</td>' + d('s', hv.s) +

        '<details class="lich-su" open><summary>Lịch sử (' + (khung === 'xung-dot' ? 3 : 2) + ')</summary>' + (khung === 'xung-dot' ? '<div class="dong-ls"><span class="so phu">14/09 10:41</span><span>Nguyễn Khánh Vy sửa R 5.0 → 5.5</span></div>' : '') + '<div class="dong-ls"><span class="so phu">18/08</span><span>Trần Ngọc Hà nhập R 5.0</span></div></details></div>' + chanLuu(null);
    } else if (id.indexOf('dr-') === 0) {
      var i = +id.split('-')[1]; hv = B.FOU12[i]; var tiep = B.FOU12[i + 1];
      p = dauPanel('VIỆC · ĐÁNH GIÁ ĐẦU RA · ' + (i + 1) + ' / 12', hv.ten, 'MB FOU 12 · GVCN đề xuất, QL chốt') +
        '<div class="panel-than"><div class="thanh-buoc" aria-label="Đã đánh giá 2 / 12">' + B.FOU12.map(function (x, j) { return '<i class="' + (j < 2 ? 'xong' : j === i ? 'nay' : '') + '"></i>'; }).join('') + '</div>' +
        '<div class="so-sanh"><span></span><span class="h">L</span><span class="h">R</span><span class="h">W</span><span class="h">S</span>' +
        '<span class="nh">Progress</span>' + ['l', 'r', 'w', 's'].map(function (k) { return '<span class="c">' + hv.p[k] + '/25</span>'; }).join('') +
        '<span class="nh">Final</span><span class="c phu">chưa nhập</span><span class="c phu">chưa nhập</span><span class="c phu">21/09</span><span class="c phu">28/09</span></div>' +
        '<div class="truong"><span class="nhan-truong">Kết quả</span><span><span class="bd bd-kq thieu">– Chưa đủ dữ liệu</span> <span class="phu">máy tính khi đủ Final 4 kỹ năng</span></span></div>' +
        '<div class="truong"><label for="nx">Nhận xét GVCN</label><textarea id="nx" class="o">' + (khung === 'thuong' ? '' : 'Đọc hiểu tiến bộ rõ; cần luyện viết đoạn có ý chính.') + '</textarea></div>' +
        '<div class="truong"><span class="nhan-truong">Đề xuất bước tiếp</span><div class="lua-chon" role="radiogroup"><label' + (khung === 'thuong' ? '' : ' class="chon"') + '><input type="radio" name="bt"> Lên lớp kế</label><label><input type="radio" name="bt"> Lên FT</label><label><input type="radio" name="bt"> Học lại</label><label><input type="radio" name="bt"> Tạm dừng</label><label><input type="radio" name="bt"> Dừng học</label></div><span class="phu">QL Nguyễn Khánh Vy chốt ở Lộ trình tiếp theo.</span></div>' +
        '<details class="lich-su"><summary>Lịch sử (0)</summary></details></div>' + chanLuu(tiep ? 'Em tiếp: ' + tiep.ten : null).replace('Lưu và tiếp', 'Lưu và em tiếp');
    }
    var el = document.getElementById('panel-noi');
    el.innerHTML = '<aside class="panel" aria-label="Panel việc">' + p + '</aside>';
    document.body.classList.add('co-panel');
    el.querySelectorAll('[data-dong]').forEach(function (b) { b.onclick = function () { location.href = url({ viec: null }); }; });
  }

  function gan() {
    noi.querySelectorAll('[data-viec]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); location.href = url({ viec: b.dataset.viec }); }; });
    noi.querySelectorAll('[data-sua]').forEach(function (b) { b.onclick = function () { location.href = url({ viec: 'sua-' + b.dataset.sua }); }; });
    noi.querySelectorAll('[data-loc]').forEach(function (b) { b.onclick = function () { location.href = url({ loc: b.dataset.loc }); }; });
    var cl = document.getElementById('chon-luot'); if (cl) cl.onchange = function () { location.href = url({ luot: this.value }); };
    var ml = document.getElementById('mo-luoi'); if (ml) ml.onclick = function () { document.getElementById('luoi').classList.toggle('mo'); };
    if (q.get('viec')) moPanel(q.get('viec'));
  }
})();
</script>
</body>
</html>
