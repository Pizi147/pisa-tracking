<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xoá vắng · Lịch sử điểm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@500;600;700&display=swap">
<style>
/* PR-BV mockup bản 2 (chủ sản phẩm chốt 06/10: không nút mới). Token chép từ mockup LT3 (= web/src/index.css). Chữ trong khung màn = chữ thật trên web. */
:root{
  color-scheme:dark;
  --bg:#0c1220;--surface:#141d2f;--surface-2:#1a2437;--line:rgba(160,178,214,.14);--line-strong:rgba(160,178,214,.26);
  --accent:#7db3f0;--accent-ink:#0b1626;--accent-soft:rgba(125,179,240,.14);--accent-line:rgba(125,179,240,.38);
  --text:#dde5f2;--chu-1:#f1f5f9;--chu-2:#e2e8f0;--chu-3:#cbd5e1;--dim:#93a3c0;--faint:#8292ae;--mo:#475569;
  --late:#ff9166;--late-bg:#3e1f13;--soon:#f2c450;--soon-bg:#352b10;--done:#a9b5c8;--done-bg:#1a2436;
  --wait:#c4a9ff;--wait-bg:#272043;--muted:#c9d4e6;--muted-bg:#1d2a40;--ok:#6fdc9f;--ok-bg:#16301f;
  --nut-hover:#24304a;--o-sua-vien:#4f79b3;--o-sua-nen:#0e1a2e;--man-che:rgba(4,8,16,.62);
  --sans:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;--num:"Inter","Be Vietnam Pro",sans-serif;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f5f7fa;--surface:#fff;--surface-2:#eef1f5;--line:rgba(15,23,42,.12);--line-strong:rgba(15,23,42,.22);
  --accent:#1d5fbf;--accent-ink:#fff;--accent-soft:rgba(29,95,191,.08);--accent-line:rgba(29,95,191,.35);
  --text:#0f172a;--chu-1:#0f172a;--chu-2:#1e293b;--chu-3:#334155;--dim:#475569;--faint:#5b6678;--mo:#94a3b8;
  --late:#b4400f;--late-bg:#fde6d8;--soon:#8a5a00;--soon-bg:#fdf1cf;--done:#4b5563;--done-bg:#eef0f3;
  --wait:#5b3fb8;--wait-bg:#ece6fd;--muted:#334155;--muted-bg:#eef1f5;--ok:#157a42;--ok-bg:#e2f4ea;
  --nut-hover:#e4e8ee;--o-sua-vien:#7c8799;--o-sua-nen:#fff;--man-che:rgba(15,23,42,.38);}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f7fa;--surface:#fff;--surface-2:#eef1f5;--line:rgba(15,23,42,.12);--line-strong:rgba(15,23,42,.22);
  --accent:#1d5fbf;--accent-ink:#fff;--accent-soft:rgba(29,95,191,.08);--accent-line:rgba(29,95,191,.35);
  --text:#0f172a;--chu-1:#0f172a;--chu-2:#1e293b;--chu-3:#334155;--dim:#475569;--faint:#5b6678;--mo:#94a3b8;
  --late:#b4400f;--late-bg:#fde6d8;--soon:#8a5a00;--soon-bg:#fdf1cf;--done:#4b5563;--done-bg:#eef0f3;
  --wait:#5b3fb8;--wait-bg:#ece6fd;--muted:#334155;--muted-bg:#eef1f5;--ok:#157a42;--ok-bg:#e2f4ea;
  --nut-hover:#e4e8ee;--o-sua-vien:#7c8799;--o-sua-nen:#fff;--man-che:rgba(15,23,42,.38);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding:16px 16px 56px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
/* ---- khung trình bày (ngoài màn) ---- */
.dieu{max-width:1240px;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.dieu h1{font-size:17px;margin:0 10px 0 0;color:var(--chu-1)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 11px;min-height:34px;font-size:12.5px;font-weight:600;color:var(--dim);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--chu-1)}
.chuthich{max-width:1240px;margin:0 auto 12px;font-size:12.5px;color:var(--faint)}
.man{margin:0 auto;max-width:1240px}
.man.w375{max-width:375px}
.app{position:relative;background:var(--bg);border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;min-height:560px}
.thanh{display:flex;align-items:center;gap:18px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
.thanh b{color:var(--chu-1);font-size:14px}.thanh .on{color:var(--accent);font-weight:700}.thanh .sp{flex:1}
.w375 .an375{display:none!important}
.tab{display:flex;gap:4px;padding:10px 16px 0}
.tab span{padding:6px 10px;font-size:13px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.tab .on{color:var(--chu-1);border-color:var(--accent)}
.than{padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.w375 .than{padding:12px 12px 18px}
.dong{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.sp{flex:1}
.nut{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--chu-2);cursor:pointer;white-space:nowrap}
.nut:hover{background:var(--nut-hover)}
.nut.chinh{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nut.nguy{background:var(--late);border-color:var(--late);color:var(--bg)}
.nut.vien-nguy{color:var(--late);border-color:var(--late);background:transparent}
.nut.ma{background:transparent;border-color:transparent;color:var(--dim)}
.nut[disabled]{opacity:.45;cursor:not-allowed}
.w375 .nut{min-height:44px}
.the{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dau-the{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dau-the h2{font-size:15px;margin:0;color:var(--chu-1)}
.nhan{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;line-height:1.5}
.n-soon{background:var(--soon-bg);color:var(--soon)}.n-wait{background:var(--wait-bg);color:var(--wait)}.n-ok{background:var(--ok-bg);color:var(--ok)}
.n-done{background:var(--done-bg);color:var(--done)}.n-late{background:var(--late-bg);color:var(--late)}.n-muted{background:var(--muted-bg);color:var(--muted)}
.mo-ta{font-size:12px;color:var(--faint)}
/* ---- hồ sơ Mock: dòng kỹ năng ---- */
.kn{display:grid;grid-template-columns:110px minmax(0,1fr) 90px auto;align-items:center;gap:10px;padding:0 14px;min-height:52px;border-bottom:1px solid var(--line)}
.kn:last-child{border-bottom:0}
.kn b{color:var(--chu-1);font-size:13px}
.kn .lich{font-size:12.5px;color:var(--chu-3)}
.kn .lich .mo-ta{display:block}
.kn .diem{font:600 14px var(--num);color:var(--chu-1)}
.kn .tt{display:flex;align-items:center;gap:6px;justify-content:flex-end;position:relative}
.kn.sang{background:var(--accent-soft)}
.w375 .kn{grid-template-columns:minmax(0,1fr) auto;padding:8px 12px;row-gap:4px}
.w375 .kn .diem{display:none}
.ba-cham{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--dim);cursor:pointer;font-weight:800;letter-spacing:1px}
.ba-cham:hover,.ba-cham[aria-expanded=true]{background:var(--nut-hover);border-color:var(--line-strong)}
.w375 .ba-cham{width:44px;height:44px}
.menu{position:absolute;right:0;top:38px;min-width:200px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:4px;z-index:4;box-shadow:0 10px 30px rgba(0,0,0,.28);text-align:left}
.menu div{padding:8px 10px;border-radius:6px;font-size:13px;color:var(--chu-2);cursor:pointer;white-space:nowrap}
.menu div:hover,.menu .hl{background:var(--accent-soft);color:var(--chu-1)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.w375 .menu div{min-height:44px;display:flex;align-items:center}
/* ---- bảng điểm ---- */
.cuon{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--dim);padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:0 10px;height:44px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--chu-3)}
tr:last-child>td{border-bottom:0}
th.c,td.c{text-align:center}
td.ten{font-weight:600;color:var(--chu-1);white-space:nowrap}
td.ten small{display:block;font:500 11.5px var(--num);color:var(--faint)}
.chon{width:40px;padding:0 0 0 12px}
th.chon,td.chon,th.ghim,td.ghim{position:sticky;left:0;background:var(--surface);z-index:1}
th.chon{background:var(--surface-2)}
td.ghim,th.ghim{left:40px}th.ghim{background:var(--surface-2)}
.hop-chon{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.w375 .hop-chon{width:22px;height:22px}
tr.da-chon>td{background:var(--accent-soft)}
tr.da-chon>td.chon,tr.da-chon>td.ghim{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.o{display:inline-flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:6px;font:600 13.5px var(--num);color:var(--chu-1)}
.o.trong{border:1px solid var(--o-sua-vien);background:var(--o-sua-nen);color:var(--mo);font-weight:500}
.o.vang{width:auto;padding:0 8px;border:1px dashed var(--soon);color:var(--soon);background:var(--soon-bg);font:600 12px var(--sans);cursor:pointer}
.o.vang.tat{border-style:solid;cursor:default;opacity:.85}
.o.mat{color:var(--mo);font-weight:500;text-decoration:line-through}
.o.focus{border:1px solid var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:var(--o-sua-nen);color:var(--mo)}
.wtb{color:var(--dim);font:600 13px var(--num)}
.o-thuong{position:relative;display:inline-flex;align-items:center;gap:2px}
/* thanh chọn */
.thanh-chon{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:10px}
.thanh-chon b{color:var(--chu-1);font-size:13px}
.w375 .thanh-chon{position:sticky;bottom:0;z-index:3;border-radius:12px;box-shadow:0 -6px 20px rgba(0,0,0,.2);background:var(--surface)}
.seg-luot{display:flex;gap:6px;flex-wrap:wrap}
.seg-luot button{display:flex;flex-direction:column;align-items:flex-start;padding:5px 12px;min-width:96px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);cursor:pointer;line-height:1.3}
.seg-luot button b{font-size:13px;color:var(--chu-2)}.seg-luot button small{font:500 11.5px var(--num);color:var(--faint)}
.seg-luot button[aria-selected=true]{background:var(--accent-soft);border-color:var(--accent)}.seg-luot button[aria-selected=true] b{color:var(--accent)}
.cong-tac{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--chu-3)}
/* ---- hộp thoại ---- */
.che{position:absolute;inset:0;background:var(--man-che);display:flex;align-items:center;justify-content:center;z-index:8;padding:16px}
.hop{width:440px;max-width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);display:flex;flex-direction:column}
.w375 .che{align-items:flex-end;padding:0}
.w375 .hop{width:100%;border-radius:16px 16px 0 0;border-bottom:0}
.hop .dau-hop{padding:16px 18px 6px}
.hop h3{margin:0;font-size:16px;color:var(--chu-1)}
.hop .phu{font-size:12.5px;color:var(--faint);margin-top:2px}
.hop .ruot{padding:8px 18px 4px;display:flex;flex-direction:column;gap:12px}
.hop .chan{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px 16px}
.w375 .hop .chan>.nut{flex:1}
.bang-doi{display:grid;grid-template-columns:110px 1fr;row-gap:8px;font-size:13px}
.bang-doi span{color:var(--faint)}.bang-doi b{color:var(--chu-1);font-family:var(--num);font-weight:600}
.bang-doi .mui{color:var(--faint);font-weight:500;margin:0 6px}
.nhan-o{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:4px;display:block}
textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);padding:8px 10px;font-size:13px}
textarea::placeholder{color:var(--mo)}
.ticks{display:flex;gap:6px;flex-wrap:wrap}
.tick{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;font-weight:600;font-size:13px;color:var(--chu-3);cursor:pointer;background:var(--surface-2)}
.tick.on{border-color:var(--accent);color:var(--chu-1);background:var(--accent-soft)}
.w375 .tick{min-height:44px;flex:1;justify-content:center}
.xem-truoc{padding:10px 12px;border-radius:8px;background:var(--late-bg);color:var(--late);font-weight:600;font-size:13px}
.xem-truoc.rong{background:var(--surface-2);color:var(--dim);font-weight:500}
.xem-truoc.dem{background:var(--surface-2);color:var(--faint);font-weight:500}
.loi{padding:9px 12px;border-radius:8px;background:var(--late-bg);color:var(--late);font-size:12.5px;font-weight:600}
/* toast */
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--chu-1);color:var(--bg);padding:10px 12px 10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:9;white-space:nowrap}
.toast .nut{background:transparent;border-color:transparent;color:var(--bg);text-decoration:underline;min-height:28px}
.toast.do{background:var(--late);color:var(--bg)}
.w375 .toast{left:12px;right:12px;transform:none;white-space:normal}
/* ô "-" đã chốt */
.o.dau{border:1px solid var(--o-sua-vien);background:var(--o-sua-nen);color:var(--soon);font-size:15px}
.o.dau.khoa{border-color:transparent;background:transparent;color:var(--soon);opacity:.8}
.o-kem{display:inline-flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.o-kem small{font:600 10.5px var(--num);color:var(--faint);white-space:nowrap}
/* ngăn Lịch sử (= DongThoiGianLuot) */
.ngan{position:absolute;top:0;right:0;bottom:0;width:400px;background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:-12px 0 40px rgba(0,0,0,.3);z-index:7;display:flex;flex-direction:column}
.w375 .ngan{width:100%;border-left:0}
.ngan .dau-ngan{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ngan h3{margin:0;font-size:16px;color:var(--chu-1)}
.ngan ol{list-style:none;margin:0;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ngan li{display:flex;gap:8px;font-size:12.5px}
.ngan li svg{flex:none;margin-top:3px}
.ngan .v1{color:var(--chu-2)}.ngan .v1 b{font-weight:600}.ngan .v1 span{color:var(--dim)}
.ngan .v2{font:500 11.5px var(--num);color:var(--faint)}
.ic-diem{color:var(--dim)}.ic-huy{color:var(--late)}.ic-vang{color:var(--soon)}
@media (prefers-reduced-motion:no-preference){.man{transition:max-width .2s ease-out}}
</style>

<div class="dieu">
  <h1>PR-BV bản 2 · Xoá "-" · Lịch sử điểm</h1>
  <div class="seg" role="group" aria-label="Phần" id="phan"><button data-p="a" aria-pressed="true">A · Xoá "-"</button><button data-p="b">B · Lịch sử điểm</button></div>
  <div class="seg" role="group" aria-label="Khổ" id="kho"><button data-w="1440" aria-pressed="true">1440</button><button data-w="375">375</button></div>
  <div class="seg" role="group" aria-label="Nền" id="nen"><button data-t="dark" aria-pressed="true">Tối</button><button data-t="light">Sáng</button></div>
</div>
<div class="dieu"><div class="seg" role="group" aria-label="Trạng thái" id="trangThai"></div></div>
<p class="chuthich" id="chuthich"></p>
<div class="man" id="man"><div class="app" id="app"></div></div>

<script>
const IC_CHUONG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
const TT = {
  a: [
    ['ft-truoc', 'FT · "-" đã tự dời', 'Lưới MT2 (Điểm theo lớp / Lịch Test). "-" gõ cho tuần đã qua đã chốt, L tự dời sang W3 SEP. Ô vẫn hiện "-" kèm tuần mới. QL, hoặc GV chấm / GVCN trước hết thứ Tư sau W2 SEP: tẩy ô + Lưu.'],
    ['ft-sau', 'FT · sau khi xoá "-"', 'L về W2 SEP, lần vắng 1 → 0, ô trống nhập điểm được ngay. Không chuông mới.'],
    ['ft-hs', 'FT · hồ sơ Mock', 'Cùng việc, nhìn ở hồ sơ Mock: trước (vắng lần 1, dời từ W2 SEP) và sau (W2 SEP). Thẻ Chờ duyệt / Xin dời chưa xử lý tự rút.'],
    ['thuong-truoc', 'Lớp thường · tuần mới đã có điểm', 'Xem tuần W2 SEP: ô Nghe của Vũ Gia Bảo "-" (đã dời W3 SEP và đã có điểm 15/20 ở W3 SEP).'],
    ['thuong-sau', 'Lớp thường · sau khi xoá "-"', 'Đã có điểm ở tuần mới → chỉ trừ lần vắng, lịch giữ W3 SEP.'],
    ['qua-han', 'GVBM · quá hạn', 'Quá thứ Tư sau tuần thi gốc: ô "-" khoá với GV; thử xoá → báo lỗi. QL vẫn xoá được.'],
  ],
  b: [
    ['ft', 'FT · Lịch sử', 'Hồ sơ Mock › Lịch sử (đã có). Tẩy ô = dòng "Huỷ điểm … → Trống". Nhầm thì đọc điểm cũ ở đây rồi nhập lại.'],
    ['thuong', 'Lớp thường · Lịch sử ô', 'Lưới lớp thường › ⋯ ô › Lịch sử (đã có). Sửa lỗi: nay chưa hiện các lần sửa / xoá điểm lớp thường.'],
  ],
};
let P = 'a', S = 'ft-truoc', W = 1440;
const w375 = () => W === 375;
function khung(mucOn, noi, phu = '') {
  const tabs = mucOn === 'test' ? '<div class="tab"><span>Lịch Test</span><span class="on">Điểm theo lớp</span><span class="an375">Kế hoạch Test</span></div>' : '';
  return `<div class="thanh"><b>PISA</b><span class="an375">Tổng quan</span><span class="an375 ${mucOn === 'hv' ? 'on' : ''}">Học viên &amp; Lớp</span><span class="${mucOn === 'test' ? 'on' : 'an375'}">Test</span><span class="an375">Công việc</span><span class="sp"></span><span>${IC_CHUONG}</span></div>${tabs}<div class="than">${noi}</div>${phu}`;
}
const toast = (chu, do_ = false) => `<div class="toast ${do_ ? 'do' : ''}" role="status">${chu}</div>`;
const dau = (doi, khoa = false, focus = false) => focus ? '<span class="o focus">—</span>'
  : `<span class="o-kem"><span class="o dau ${khoa ? 'khoa' : ''}" aria-label="Vắng${doi ? `, dời ${doi}` : ''}">-</span>${doi ? `<small>→ ${doi}</small>` : ''}</span>`;

/* ---------- lưới FT ---------- */
const HV = [
  ['Lê Hà Vy', '000001', [null, '6.5', '6.0', '5.5', '6.0', '6.0']],
  ['Ngô Gia Huy', '000007', ['7.0', '7.5', '7.0', '6.5', '6.5', '7.0']],
  ['Nguyễn Đức Trung', '000010', ['5.5', '6.0', '5.5', '6.0', '6.0', '5.5']],
  ['Phạm Tiến Đạt', '000003', ['5.0', '5.5', '5.0', '5.5', '5.5', '5.5']],
];
function luoiFT(oL) {
  const than = HV.map(([ten, ma, d], i) => {
    const o = (v) => v ? `<span class="o">${v}</span>` : '<span class="o trong">—</span>';
    const l = i === 0 ? oL : o(d[0]);
    const du = i !== 0;
    return `<tr><td class="ten">${ten}<small>${ma}</small></td><td class="c">${l}</td>${[1, 2, 3].map((k) => `<td class="c">${o(d[k])}</td>`).join('')}
      <td class="c wtb">${d[4]}</td><td class="c">${o(d[5])}</td><td>${du ? '<span class="nhan n-ok">Đủ</span>' : '<span class="nhan n-wait">Chờ điểm</span>'}</td></tr>`;
  }).join('');
  return `<div class="the cuon"><table style="min-width:600px"><thead><tr><th>Học viên</th><th class="c">L</th><th class="c">R</th><th class="c">W1</th><th class="c">W2</th><th class="c">W</th><th class="c">S</th><th>Kết quả</th></tr></thead><tbody>${than}</tbody></table></div>`;
}
function manFT(oL, phu = '') {
  const seg = `<div class="seg-luot" role="tablist"><button role="tab" aria-selected="false"><b>MT1</b><small>W1 JUL · 4/4 đủ</small></button><button role="tab" aria-selected="true"><b>MT2</b><small>W2 SEP · 3/4 đủ</small></button><button role="tab" aria-selected="false" class="an375"><b>MT3</b><small>W4 OCT</small></button></div>`;
  return khung('test', `<div class="dong"><b style="color:var(--chu-1);font-size:15px">MB FT 101</b></div>${seg}<div class="dong"><label class="cong-tac"><input type="checkbox" class="hop-chon"> Chỉ ô còn trống</label></div>${luoiFT(oL)}`, phu);
}

/* ---------- hồ sơ Mock ---------- */
function dongKn({ ten, lich, phu = '', diem = '—', nhan = '', chinh = '' }) {
  return `<div class="kn"><div><b>${ten}</b></div><div class="lich"><span class="num">${lich}</span> ${nhan}${phu ? `<span class="mo-ta">${phu}</span>` : ''}</div><div class="diem">${diem}</div><div class="tt">${chinh}<button class="ba-cham" aria-label="Thao tác · ${ten}">⋯</button></div></div>`;
}
function theKn(l) {
  return `<div class="the"><div class="dau-the"><h2>Kỹ năng</h2><span class="sp"></span><button class="nut">Lịch sử</button></div>${l}
    ${dongKn({ ten: 'Reading', lich: 'W2 SEP', diem: '6.5', chinh: '<button class="nut">Sửa điểm</button>' })}
    ${dongKn({ ten: 'Writing', lich: 'W2 SEP', diem: '6.0', chinh: '<button class="nut">Sửa điểm</button>' })}
    ${dongKn({ ten: 'Speaking', lich: 'W2 SEP', diem: '6.0', chinh: '<button class="nut">Sửa điểm</button>' })}</div>`;
}
function hoSo(noi, phu = '') {
  return khung('hv', `<div class="dong"><div><div class="mo-ta">Hồ sơ Mock · MB FT 101</div><h2 style="margin:0;font-size:18px;color:var(--chu-1)">Lê Hà Vy · MT2</h2></div><span class="sp"></span><span class="nhan n-soon">Chờ điểm</span></div>${noi}`, phu);
}

/* ---------- lớp thường ---------- */
function manThuong(oNghe, phu = '') {
  const R = [['Trần Minh Anh', '000031', ['16/20', '15/20', '30/40', '7/10'], true], ['Đỗ Khánh Linh', '000032', ['12/20', '14/20', '28/40', '6/10'], true],
    ['Vũ Gia Bảo', '000033', [null, '13/20', '26/40', '6/10'], false]];
  const than = R.map(([ten, ma, d, du], i) => `<tr><td class="ten">${ten}<small>${ma}</small></td>
    ${d.map((v, k) => `<td class="c">${i === 2 && k === 0 ? oNghe : `<span class="o">${v}</span>`}</td>`).join('')}
    <td>${du ? '<span class="nhan n-ok">4/4 đạt</span>' : '<span class="nhan n-muted">Nghe ở W3 SEP</span>'}</td></tr>`).join('');
  const tuan = `<div class="dong"><button class="nut" aria-label="Tuần trước">‹</button><span class="nut" style="min-width:150px;justify-content:space-between"><b class="num">W2 SEP</b><span class="mo-ta num">08/09 – 14/09</span></span><button class="nut" aria-label="Tuần sau">›</button></div>`;
  return khung('test', `<div class="dong"><b style="color:var(--chu-1);font-size:15px">MB PRE 204 · Giữa khoá</b><span class="sp"></span>${tuan}</div>
    <div class="the cuon"><table style="min-width:560px"><thead><tr><th>Học viên</th><th class="c">Nghe</th><th class="c">Đọc</th><th class="c">G+V</th><th class="c">Viết</th><th>Kết quả</th></tr></thead><tbody>${than}</tbody></table></div>`, phu);
}

/* ---------- ngăn Lịch sử ---------- */
const IC = {
  diem: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" class="ic-diem" aria-hidden="true"><path d="M2 10l1-3 5-5 2 2-5 5-3 1z"/></svg>',
  huy: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" class="ic-huy" aria-hidden="true"><circle cx="6" cy="6" r="4.5"/><path d="M3 9l6-6"/></svg>',
  vang: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" class="ic-vang" aria-hidden="true"><circle cx="6" cy="6" r="4.5"/><path d="M6 3.5V6.5M6 8.3v.2"/></svg>',
};
const dongLs = (ic, viec, mon, doi, ai, luc, lyDo = '') => `<li>${IC[ic]}<div><div class="v1"><b>${viec}</b><span> · ${mon}</span>${doi ? `<span> · ${doi}</span>` : ''}</div><div class="v2">${ai} · ${luc}${lyDo ? ` · Lý do: ${lyDo}` : ''}</div></div></li>`;
function nganLs(tieuDe, phu, dong) {
  return `<aside class="ngan" role="dialog" aria-label="${tieuDe}"><div class="dau-ngan"><div><h3>${tieuDe}</h3><div class="mo-ta">${phu}</div></div><span class="sp"></span><button class="nut ma" aria-label="Đóng">✕</button></div><ol>${dong}</ol></aside>`;
}

function ve() {
  let html = '';
  const lTuDoi = dongKn({ ten: 'Listening', lich: 'W3 SEP', nhan: '<span class="nhan n-soon">vắng lần 1</span>', phu: 'dời từ W2 SEP', chinh: '<button class="nut chinh">Nhập điểm</button>' });
  const lSau = dongKn({ ten: 'Listening', lich: 'W2 SEP', chinh: '<button class="nut chinh">Nhập điểm</button>' });
  switch (S) {
    case 'ft-truoc': html = manFT(dau('W3 SEP')); break;
    case 'ft-sau': html = manFT(dau(null, false, true), toast('Đã gỡ vắng Listening · Lê Hà Vy · về W2 SEP')); break;
    case 'ft-hs': html = hoSo(`<div class="mo-ta">Trước</div>${theKn(lTuDoi)}<div class="mo-ta">Sau khi xoá "-"</div>${theKn(lSau)}`); break;
    case 'thuong-truoc': html = manThuong(dau('W3 SEP')); break;
    case 'thuong-sau': html = manThuong('<span class="o-kem"><span class="o">15/20</span><small>W3 SEP</small></span>', toast('Đã gỡ vắng Nghe · Vũ Gia Bảo · giữ W3 SEP')); break;
    case 'qua-han': html = manFT(dau('W3 SEP', true), toast('Quá hạn chấm — nhờ Quản lý.', true)); break;
    case 'ft': html = hoSo(theKn(lSau),
      nganLs('Lịch sử', 'Lê Hà Vy · MT2',
        dongLs('huy', 'Huỷ điểm', 'Listening', '6.0 → Trống', 'Võ Minh Khoa', '06/10/2026 14:20')
        + dongLs('diem', 'Sửa điểm', 'Reading', '6.0 → 6.5', 'Võ Minh Khoa', '06/10/2026 14:18')
        + dongLs('diem', 'Sửa điểm', 'Listening', 'Trống → 6.0', 'Võ Minh Khoa', '16/09/2026 09:05')
        + dongLs('vang', 'Dấu "-"', 'Speaking', '- → Trống', 'Trần Thu Hà', '15/09/2026 10:02'))); break;
    case 'thuong': html = manThuong('<span class="o trong">—</span>',
      nganLs('Lịch sử · Nghe', 'Vũ Gia Bảo',
        dongLs('huy', 'Huỷ điểm', 'Nghe', '15/20 → Trống', 'Đặng Thu Trang', '06/10/2026 15:02')
        + dongLs('diem', 'Sửa điểm', 'Nghe', '16/20 → 15/20', 'Đặng Thu Trang', '06/10/2026 15:01', 'Chấm lại câu 12')
        + dongLs('diem', 'Sửa điểm', 'Nghe', 'Trống → 16/20', 'Đặng Thu Trang', '17/09/2026 08:40'))); break;
  }
  document.getElementById('app').innerHTML = html;
  document.getElementById('man').className = 'man' + (w375() ? ' w375' : '');
  document.getElementById('chuthich').textContent = TT[P].find((x) => x[0] === S)[2];
}
function veTrangThai() {
  document.getElementById('trangThai').innerHTML = TT[P].map(([k, n]) => `<button data-s="${k}" aria-pressed="${k === S}">${n}</button>`).join('');
}
const bat = (id, attr, fn) => document.getElementById(id).addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  for (const x of document.querySelectorAll(`#${id} button`)) x.setAttribute('aria-pressed', String(x === b));
  fn(b.dataset[attr]); ve();
});
bat('phan', 'p', (v) => { P = v; S = TT[v][0][0]; veTrangThai(); });
bat('trangThai', 's', (v) => { S = v; });
bat('kho', 'w', (v) => { W = Number(v); });
bat('nen', 't', (v) => { document.documentElement.dataset.theme = v; });
document.documentElement.dataset.theme = 'dark';
veTrangThai(); ve();
</script>
</html>
