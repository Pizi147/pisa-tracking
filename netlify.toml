[build]
  # `npm run build` tự lấy phần nhị phân Linux của libsql trước (scripts/goi-libsql-linux.mjs) — máy build là Windows, Netlify chạy Linux.
  command = "npm run build"
  publish = "dist/web"

[build.environment]
  NODE_VERSION = "22"
  VITE_BAN_CHINH = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["libsql", "@libsql/linux-x64-gnu"]

# Chốt dấu "-" đầu thứ Hai kể cả khi không ai mở web (RB-1). Giờ UTC: 00:05 và 06:05 sáng thứ Hai giờ Việt Nam.
# Đổi lịch thì sửa cả LICH_CHOT_VANG trong server/src/ops/chotVangDinhKy.ts.
[functions."chot-vang"]
  schedule = "5 17,23 * * 0"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Mảnh cũ đã mất sau deploy → 404 thật, không rơi xuống index.html (HTML mang header cache 1 năm của /assets sẽ kẹt; taiLaiManh.ts tự tải lại trang).
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
